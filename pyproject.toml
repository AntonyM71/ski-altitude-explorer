[project]
name = "ski-altitude"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
]

[dependency-groups]
busyness = [
    "duckdb>=1.1",
    "networkx>=3.7",
    "numpy>=2",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["prototypes", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
