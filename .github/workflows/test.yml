name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint
        run: uv run --group dev ruff check busyness tests
      # The busyness pipeline's tests use small hand-made networks; no map data needed.
      - name: Python tests
        run: uv run --group busyness --group dev pytest -q
      # The engine's tests include decision 011's observation checks on the test domains' fixtures.
      - name: Engine tests
        working-directory: busyness-engine
        run: node --test
