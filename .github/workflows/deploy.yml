name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC; OpenSkiMap rebuilds daily, weekly is plenty
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # a stalled OpenSkiMap download shouldn't hold the queue for GitHub's 6-hour default
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # Reuse this ISO week's OpenSkiMap download, so pushes don't fetch ~1 GB each time.
      # The Monday run starts a new week and so downloads fresh data.
      - id: week
        run: echo "key=openskimap-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: ${{ steps.week.outputs.key }}
      - run: uv run python fetch.py
      - run: uv run python build_stats.py
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/ski_area_stats.json _site/data/
          cp -r data/runs _site/data/
      # The busyness overlay: the engine, and the last structure files the Busyness workflow published. Without a
      # published set the site deploys as usual, with no overlay.
      - name: Add the busyness overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/busyness-engine _site/data/busy
          cp -r busyness-engine/src _site/busyness-engine/
          if gh release download busyness-latest -p busyness.tar.gz -D busy-set; then
            tar -xzf busy-set/busyness.tar.gz -C _site/data/busy
            echo "Busyness overlay for $(ls _site/data/busy | grep -c '\.json$') files"
          else
            echo "No busyness set published yet: deploying without the overlay"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
